name: Motion Studio CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/*', 'scene/*', 'fix/*', 'feat/**', 'chore/*']

jobs:
  audit-and-verify:
    name: Motion Lab Quality & Determinist Gate
    # Pinned explicitly: ubuntu-latest migrates from 24.04 to 26.04 between
    # 2026-10-19 and 2026-11-19. Pinning keeps CI reproducible.
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Node.js 26.x (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CSS
        run: pnpm build:css

      # Harness v2 gate: spec, storyboard (SB), AST (V2), timeline (T), slop, unit and eval
      # self-tests, generated-doc freshness, tsc. The browser-probe fixture tests need Chrome and
      # run only with CHECK_PROBE=1, which is deliberately not set here (they are skipped, not failed).
      - name: Run Full Quality Gate (pnpm check)
        run: pnpm check

      - name: Run Studio Doctor Health Audit (14 points)
        run: pnpm audit:doctor

      - name: Verify Pre-Render Gate on Default Projects
        run: |
          pnpm gate --project single-container-broll
          pnpm gate --project kinetic-loud-showreel
