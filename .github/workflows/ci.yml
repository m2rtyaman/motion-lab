name: Motion Studio CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feat/*', 'scene/*', 'fix/*', 'feat/**', 'chore/*']

jobs:
  audit-and-verify:
    name: Motion Lab Quality & Determinist Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup Node.js 26.x (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build CSS
        run: pnpm build:css

      - name: Run Full Quality Gate (Spec, AST, Slop, Critic, Glyph, Types)
        run: pnpm check

      - name: Run 14-Point Studio Doctor Health Audit
        run: pnpm audit:doctor

      - name: Verify Pre-Render Gate on Default Projects
        run: |
          pnpm gate --project single-container-broll
          pnpm gate --project kinetic-loud-showreel
