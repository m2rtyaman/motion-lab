<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Midnight Slate Sky Gradient -->
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#223048" />
      <stop offset="50%" stop-color="#162030" />
      <stop offset="100%" stop-color="#090E17" />
    </linearGradient>

    <!-- Deep Smog Fog Gradient -->
    <radialGradient id="bgSmog" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2D3E5C" stop-opacity="0.65" />
      <stop offset="60%" stop-color="#182335" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1920" height="1080" fill="url(#bgSky)" />
  <rect width="1920" height="1080" fill="url(#bgSmog)" />

  <!-- Distant Art Deco Goth Spire Layer -->
  <g fill="#101724">
    <polygon points="120,880 120,320 160,210 165,160 170,210 210,320 210,880" />
    <polygon points="340,880 340,380 375,290 380,240 385,290 420,380 420,880" />
    <polygon points="580,880 580,260 620,150 625,90 630,150 670,260 670,880" />
    <polygon points="820,880 820,410 860,320 900,410 900,880" />
    <polygon points="1080,880 1080,280 1120,180 1125,120 1130,180 1170,280 1170,880" />
    <polygon points="1360,880 1360,340 1400,250 1440,340 1440,880" />
    <polygon points="1620,880 1620,270 1660,170 1665,110 1670,170 1710,270 1710,880" />
    <polygon points="1820,880 1820,360 1860,280 1900,360 1900,880" />
  </g>

  <!-- Midground Stepped Ziggurat Buildings -->
  <g fill="#0B101A">
    <rect x="230" y="440" width="130" height="440" />
    <polygon points="250,440 295,370 340,440" />
    <rect x="700" y="480" width="140" height="400" />
    <rect x="940" y="420" width="130" height="460" />
    <polygon points="965,420 1005,350 1045,420" />
    <rect x="1460" y="460" width="140" height="420" />
  </g>

  <!-- Luminous Amber Gothic Slit Windows -->
  <g fill="#F5BF4F" opacity="0.45">
    <rect x="160" y="320" width="4" height="24" />
    <rect x="170" y="320" width="4" height="24" />
    <rect x="620" y="260" width="5" height="30" />
    <rect x="630" y="260" width="5" height="30" />
    <rect x="1120" y="280" width="4" height="26" />
    <rect x="1130" y="280" width="4" height="26" />
    <rect x="1660" y="280" width="5" height="28" />
    <rect x="1670" y="280" width="5" height="28" />
  </g>

  <!-- Rooftop Horizon Base (18 deg slant) -->
  <polygon points="0,780 1920,540 1920,1080 0,1080" fill="#06090E" />
  <line x1="0" y1="780" x2="1920" y2="540" stroke="#25354D" stroke-width="4" />
</svg>
